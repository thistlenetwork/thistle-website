# Publishes the site to GitHub Pages. There is no build step: the pages are plain HTML.
# Only the site files are published; the README, scripts and workflows stay in the repo.
# Before each publish, update-stats.mjs refreshes the member numbers in stats.js from Zite,
# update-spaces.mjs checks how many spaces are left on upcoming events, and update-sitemap.mjs
# dates each page in sitemap.xml from when it last changed.
# Runs on every push to main, every hour (to keep the numbers live), and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first_try.outputs.page_url || steps.second_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so the sitemap dates come from when each page last changed
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh member numbers
        run: node .github/scripts/update-stats.mjs
        env:
          ZITE_API_KEY: ${{ secrets.ZITE_API_KEY }}
      - name: Check spaces left on upcoming events
        run: node .github/scripts/update-spaces.mjs
      - name: Date each page in the sitemap
        run: node .github/scripts/update-sitemap.mjs
      - name: Collect the site files (leaves out the README, scripts and workflows)
        run: rsync -a --exclude '.git*' --exclude '.github' --exclude 'README.md' --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub occasionally can't find the upload for a moment ("No artifacts named github-pages").
      # Try once, wait a minute, then try again before reporting a failure.
      - id: first_try
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before trying again
        if: steps.first_try.outcome == 'failure'
        run: sleep 60
      - id: second_try
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
