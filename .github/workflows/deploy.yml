# Publishes the site to GitHub Pages. There is no build step: the pages are plain HTML.
# Before each publish, update-stats.mjs refreshes the member numbers in stats.js from Zite.
# Runs on every push to main, every hour (to keep the numbers live), and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh member numbers
        run: node .github/scripts/update-stats.mjs
        env:
          ZITE_API_KEY: ${{ secrets.ZITE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
